            {importing?'Importando...':'Importar'}
          </button>
        </div>
      </div>
    </div>}
  </div>;
}

/* ══════════════════════════ TEMPLATES ══════════════════════════ */
const TPL_STATUS={
  APPROVED:['Aprovado','#25D366','#25D36618'],
  PENDING :['Em análise','#ECB22E','#ECB22E18'],
  REJECTED:['Rejeitado','#FF5252','#FF525218'],
  DISABLED:['Desativado','#667781','#f0f2f5'],
};
function TplBadge({status}){
  const [label,col,bg]=TPL_STATUS[status]||['–','#667781','#f0f2f5'];
  return <span style={{fontSize:11,fontWeight:600,padding:'3px 10px',borderRadius:20,background:bg,color:col}}>{label}</span>;
}

function TemplateEditModal({template,onClose,onSave,saving,error}){
  const [cost,setCost]=useState(template.costPerConversation!=null?String(template.costPerConversation):'');
  const [link,setLink]=useState(template.linkUrl||'');

  useEffect(()=>{
    const h=e=>{if(e.key==='Escape')onClose();};
    window.addEventListener('keydown',h);
    return ()=>window.removeEventListener('keydown',h);
  },[onClose]);

  const inp2={width:'100%',padding:'9px 12px',borderRadius:10,border:`1px solid ${C.br}`,fontSize:13,color:C.tx,background:'#fff',outline:'none'};

  return <div onClick={onClose} style={{position:'fixed',inset:0,background:'rgba(0,0,0,.45)',display:'flex',alignItems:'center',justifyContent:'center',zIndex:50,padding:20}}>
    <div onClick={e=>e.stopPropagation()} style={{background:'#fff',borderRadius:20,padding:24,width:'100%',maxWidth:460,boxShadow:'0 20px 60px rgba(0,0,0,.25)'}}>
      <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',gap:12,marginBottom:18}}>
        <div style={{minWidth:0}}>
          <h2 style={{fontSize:17,fontWeight:700,color:C.tx,marginBottom:3}}>Editar template</h2>
          <p style={{fontSize:12,color:C.mt}}>{template.name}</p>
        </div>
        <button onClick={onClose} title="Fechar" style={{width:30,height:30,borderRadius:9,border:`1px solid ${C.br}`,background:'#fff',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke={C.tx} strokeWidth="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>

      <div style={{background:C.bg,borderRadius:12,padding:12,marginBottom:16}}>
        <p style={{fontSize:12,color:C.tx,lineHeight:1.5,whiteSpace:'pre-wrap'}}>{template.bodyText||'—'}</p>
        <p style={{fontSize:11,color:C.mt,marginTop:8}}>O texto não pode ser alterado depois de aprovado pela Meta. Para mudá-lo, crie um novo template.</p>
      </div>

      <label style={{fontSize:12,color:C.mt,display:'block',marginBottom:4}}>Custo por conversa (R$)</label>
      <input type="number" step="0.01" min="0" value={cost} onChange={e=>setCost(e.target.value)} placeholder="0.33" style={{...inp2,marginBottom:14}}/>

      <label style={{fontSize:12,color:C.mt,display:'block',marginBottom:4}}>URL de destino do link</label>
      <input type="url" value={link} onChange={e=>setLink(e.target.value)} placeholder="https://seurestaurante.com/promo" style={inp2}/>
      <p style={{fontSize:11,color:C.mt,marginTop:6}}>Deixe em branco para remover o valor.</p>

      {error&&<div style={{marginTop:12,padding:'9px 12px',borderRadius:9,background:'#FF525218',color:'#FF5252',fontSize:12,fontWeight:500}}>{error}</div>}

      <div style={{display:'flex',gap:9,marginTop:18}}>
        <button onClick={onClose} style={{flex:1,padding:'11px',borderRadius:12,border:`1px solid ${C.br}`,background:'#fff',color:C.tx,fontWeight:600,fontSize:13}}>Cancelar</button>
        <button onClick={()=>onSave({costPerConversation:cost,linkUrl:link})} disabled={saving}
          style={{flex:1,padding:'11px',borderRadius:12,border:'none',background:C.p,color:'#fff',fontWeight:700,fontSize:13,opacity:saving?.6:1}}>
          {saving?'Salvando...':'Salvar'}
        </button>
      </div>
    </div>
  </div>;
}

function Templates({token,wabaId}){
  const [templates,setTemplates]=useState([]);
  const [loading,setLoading]=useState(true);
  const [view,setView]=useState('list');
  const [form,setForm]=useState({name:'',category:'MARKETING',language:'pt_BR',bodyText:'',footerText:'',costPerConversation:'',linkUrl:''});
  const [saving,setSaving]=useState(false);
  const [result,setResult]=useState(null);
  const [editing,setEditing]=useState(null);
  const [savingEdit,setSavingEdit]=useState(false);
  const [editError,setEditError]=useState('');

  const load=async()=>{
    if(!token||!wabaId)return;
    setLoading(true);
    try{
      const r=await fetch(`${API}/api/meta/${wabaId}/templates`,{headers:{Authorization:`Bearer ${token}`}});
      const d=await r.json();
      if(d.success) setTemplates(d.data);
    }catch(e){}
    setLoading(false);
  };
  useEffect(()=>{load();},[token,wabaId]);

  const varCount=(txt)=>{
    const nums=[...String(txt||'').matchAll(/\{\{\s*(\d+)\s*\}\}/g)].map(m=>Number(m[1]));
    return new Set(nums).size;
  };

  const submit=async()=>{
    if(!form.name.trim()||!form.bodyText.trim()){setResult({ok:false,msg:'Preencha o nome e o corpo da mensagem.'});return;}
    setSaving(true);setResult(null);
    try{
      const r=await fetch(`${API}/api/meta/${wabaId}/templates`,{method:'POST',
        headers:{'Content-Type':'application/json',Authorization:`Bearer ${token}`},
        body:JSON.stringify(form)});
      const d=await r.json();
      if(d.success){
        setResult({ok:true,msg:'✅ Template enviado para aprovação da Meta!'});
        setForm({name:'',category:'MARKETING',language:'pt_BR',bodyText:'',footerText:'',costPerConversation:'',linkUrl:''});
        load();setTimeout(()=>setView('list'),1200);
      } else setResult({ok:false,msg:'❌ '+(d.message||'Erro ao criar template.')});
    }catch(e){setResult({ok:false,msg:'Erro: '+e.message});}
    setSaving(false);
  };

  const saveEdit=async(fields)=>{
    setSavingEdit(true);setEditError('');
    try{
      const r=await fetch(`${API}/api/meta/${wabaId}/templates/${editing.id}`,{method:'PATCH',
        headers:{'Content-Type':'application/json',Authorization:`Bearer ${token}`},
        body:JSON.stringify(fields)});
      const d=await r.json();
      if(d.success){setEditing(null);load();}
      else setEditError(d.message||'Erro ao atualizar.');
    }catch(e){setEditError('Erro: '+e.message);}
    setSavingEdit(false);
  };

  const remove=async(t)=>{
    if(!confirm(`Excluir o template "${t.name}"? Isso remove também na Meta.`))return;
    try{
      const r=await fetch(`${API}/api/meta/${wabaId}/templates/${t.id}`,{method:'DELETE',headers:{Authorization:`Bearer ${token}`}});
      const d=await r.json();
      if(d.success) load(); else alert('❌ '+d.message);
    }catch(e){alert('Erro: '+e.message);}
  };

  const inp2={width:'100%',padding:'9px 12px',borderRadius:10,border:`1px solid ${C.br}`,fontSize:13,color:C.tx,background:'#fff',outline:'none'};
  const nVars=varCount(form.bodyText);

  if(view==='create') return <div style={{padding:24,overflowY:'auto',height:'100%'}}>
    <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:20}}>
      <button onClick={()=>{setView('list');setResult(null);}} style={{width:34,height:34,borderRadius:10,border:`1px solid ${C.br}`,background:'#fff',display:'flex',alignItems:'center',justifyContent:'center'}}>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke={C.tx} strokeWidth="2"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <div><h1 style={{fontSize:20,fontWeight:700,color:C.tx}}>Novo Template</h1><p style={{fontSize:13,color:C.mt}}>A Meta precisa aprovar antes do primeiro disparo</p></div>
    </div>
    <div style={{display:'grid',gridTemplateColumns:'1fr 380px',gap:16}}>
      <div style={{display:'flex',flexDirection:'column',gap:14}}>
        <div style={{background:'#fff',borderRadius:16,padding:20,border:`1px solid ${C.br}`}}>
          <h3 style={{fontWeight:600,color:C.tx,marginBottom:14,fontSize:15}}>📋 Identificação</h3>
          <label style={{fontSize:13,fontWeight:500,color:C.tx,display:'block',marginBottom:5}}>Nome do template</label>
          <input value={form.name} onChange={e=>setForm(p=>({...p,name:e.target.value}))} placeholder="reativacao_30dias" style={{...inp2,marginBottom:4}}/>
          <p style={{fontSize:11,color:C.mt,marginBottom:14}}>Somente letras minúsculas, números e underscore. Não pode ser alterado depois.</p>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
            <div>
              <label style={{fontSize:12,color:C.mt,display:'block',marginBottom:4}}>Categoria</label>
              <select value={form.category} onChange={e=>setForm(p=>({...p,category:e.target.value}))} style={inp2}>
                <option value="MARKETING">MARKETING</option>
                <option value="UTILITY">UTILITY</option>
              </select>
            </div>
            <div>
              <label style={{fontSize:12,color:C.mt,display:'block',marginBottom:4}}>Idioma</label>
              <select value={form.language} onChange={e=>setForm(p=>({...p,language:e.target.value}))} style={inp2}>
                <option value="pt_BR">Português (pt_BR)</option>
                <option value="en_US">Inglês (en_US)</option>
                <option value="es_ES">Espanhol (es_ES)</option>
              </select>
            </div>
          </div>
        </div>
        <div style={{background:'#fff',borderRadius:16,padding:20,border:`1px solid ${C.br}`}}>
          <h3 style={{fontWeight:600,color:C.tx,marginBottom:8,fontSize:15}}>💬 Corpo da mensagem</h3>
          <div style={{display:'flex',flexWrap:'wrap',gap:5,marginBottom:8}}>
            {[1,2,3,4,5].map(n=><button key={n} onClick={()=>setForm(p=>({...p,bodyText:p.bodyText+'{{'+n+'}}'}))}
              style={{fontSize:11,padding:'3px 8px',borderRadius:20,border:`1px solid ${C.p}`,background:C.p+'15',color:C.dk,cursor:'pointer'}}>{'{{'+n+'}}'}</button>)}
          </div>
          <textarea value={form.bodyText} onChange={e=>setForm(p=>({...p,bodyText:e.target.value}))} rows={6}
            placeholder="Oi {{1}}! Sentimos sua falta 🍕 Já faz {{2}} dias desde seu último pedido. Que tal pedir hoje com desconto?"
            style={{...inp2,resize:'vertical'}} maxLength={1024}/>
          <p style={{fontSize:11,color:C.mt,marginTop:6}}>
            {form.bodyText.length}/1024 · {nVars} variável(is) · use variáveis <b>posicionais</b> sequenciais a partir de {'{{1}}'}.
          </p>
          <label style={{fontSize:13,fontWeight:500,color:C.tx,display:'block',margin:'14px 0 5px'}}>Rodapé (opcional)</label>
          <input value={form.footerText} onChange={e=>setForm(p=>({...p,footerText:e.target.value}))} placeholder="Responda SAIR para não receber mais" style={inp2} maxLength={60}/>
        </div>
        <div style={{background:'#fff',borderRadius:16,padding:20,border:`1px solid ${C.br}`}}>
          <h3 style={{fontWeight:600,color:C.tx,marginBottom:14,fontSize:15}}>💰 Custo e link</h3>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
            <div>
              <label style={{fontSize:12,color:C.mt,display:'block',marginBottom:4}}>Custo por conversa (R$)</label>
              <input type="number" step="0.01" min="0" value={form.costPerConversation}
                onChange={e=>setForm(p=>({...p,costPerConversation:e.target.value}))} placeholder="0.33" style={inp2}/>
            </div>
            <div>
              <label style={{fontSize:12,color:C.mt,display:'block',marginBottom:4}}>URL de destino do link</label>
              <input type="url" value={form.linkUrl}
                onChange={e=>setForm(p=>({...p,linkUrl:e.target.value}))} placeholder="https://seurestaurante.com/promo" style={inp2}/>
            </div>
          </div>
          <p style={{fontSize:11,color:C.mt,marginTop:8,lineHeight:1.5}}>
            O custo é o que a Meta cobra por conversa iniciada — usado para estimar o gasto da campanha.
            A URL só é necessária se você mapear alguma variável para <b>Link rastreado</b> na campanha.
          </p>
        </div>
      </div>
      <div style={{display:'flex',flexDirection:'column',gap:14}}>
        <div style={{background:'#fff',borderRadius:16,padding:20,border:`1px solid ${C.br}`}}>
          <h3 style={{fontWeight:600,color:C.tx,marginBottom:12,fontSize:15}}>👁 Pré-visualização</h3>
          <div style={{background:C.bg,borderRadius:12,padding:12}}>
            <div style={{background:C.bbl,borderRadius:'12px 12px 4px 12px',padding:'8px 12px',maxWidth:'90%',marginLeft:'auto'}}>
              <p style={{fontSize:13,color:C.tx,lineHeight:1.5,whiteSpace:'pre-wrap'}}>{form.bodyText||'Sua mensagem aparece aqui…'}</p>
              {form.footerText&&<p style={{fontSize:11,color:C.mt,marginTop:6}}>{form.footerText}</p>}
            </div>
          </div>
        </div>
        <div style={{background:'#FFF8E1',borderRadius:16,padding:16,border:'1px solid #ECB22E40'}}>
          <p style={{fontSize:12,color:'#7A5B00',lineHeight:1.5}}>
            ⚠️ A Meta leva de alguns minutos a 24h para aprovar. O corpo <b>não pode começar nem terminar</b> com uma variável.
          </p>
        </div>
        {result&&<div style={{padding:'10px 14px',borderRadius:10,background:result.ok?'#25D36618':'#FF525218',color:result.ok?'#075E54':'#FF5252',fontSize:12,fontWeight:500}}>{result.msg}</div>}
        <button onClick={submit} disabled={saving} style={{padding:'14px',borderRadius:14,border:'none',background:C.p,color:'#fff',fontWeight:700,fontSize:14,opacity:saving?.6:1,boxShadow:'0 4px 14px rgba(37,211,102,.3)'}}>
          {saving?'Enviando...':'📤 Enviar para aprovação'}
        </button>
      </div>
    </div>
  </div>;

  return <div style={{padding:24,overflowY:'auto',height:'100%'}}>
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:20}}>
      <div><h1 style={{fontSize:22,fontWeight:700,color:C.tx}}>Templates</h1><p style={{fontSize:13,color:C.mt,marginTop:2}}>Mensagens aprovadas pela Meta para disparo em massa</p></div>
      <div style={{display:'flex',gap:8}}>
        <button onClick={load} style={{padding:'9px 16px',borderRadius:12,border:`1px solid ${C.br}`,background:'#fff',color:C.tx,fontWeight:600,fontSize:13}}>↻ Atualizar status</button>
        <button onClick={()=>setView('create')} style={{display:'flex',alignItems:'center',gap:6,padding:'9px 18px',borderRadius:12,border:'none',background:C.p,color:'#fff',fontWeight:600,fontSize:13}}>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> Novo template
        </button>
      </div>
    </div>
    {loading?<div style={{textAlign:'center',padding:60,color:C.mt}}>Carregando...</div>:
     templates.length===0?<div style={{background:'#fff',borderRadius:18,padding:60,textAlign:'center',border:`1px solid ${C.br}`}}>
       <div style={{width:60,height:60,borderRadius:18,background:C.p+'15',display:'flex',alignItems:'center',justifyContent:'center',margin:'0 auto 14px'}}>
         <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke={C.p} strokeWidth="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
       </div>
       <h3 style={{fontWeight:700,color:C.tx,marginBottom:6}}>Nenhum template ainda</h3>
       <p style={{fontSize:13,color:C.mt,marginBottom:20}}>Você precisa de um template aprovado para disparar campanhas.</p>
       <button onClick={()=>setView('create')} style={{padding:'10px 24px',borderRadius:12,border:'none',background:C.p,color:'#fff',fontWeight:600,fontSize:13}}>Criar template</button>
     </div>:
     <div style={{display:'flex',flexDirection:'column',gap:12}}>
       {templates.map(t=><div key={t.id} style={{background:'#fff',borderRadius:16,padding:20,border:`1px solid ${C.br}`,display:'flex',alignItems:'center',gap:16}}>
         <div style={{width:44,height:44,borderRadius:12,background:C.p+'15',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
           <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke={C.p} strokeWidth="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
         </div>
         <div style={{flex:1,minWidth:0}}>
           <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:4}}>
             <p style={{fontWeight:600,fontSize:14,color:C.tx}}>{t.name}</p>
             <TplBadge status={t.status}/>
           </div>
           <p style={{fontSize:12,color:C.mt,overflow:'hidden',whiteSpace:'nowrap',textOverflow:'ellipsis',maxWidth:460}}>{t.bodyText||'—'}</p>
           <div style={{display:'flex',gap:16,marginTop:6}}>
             <span style={{fontSize:12,color:C.mt}}>{t.category}</span>
             <span style={{fontSize:12,color:C.mt}}>{t.language}</span>
             <span style={{fontSize:12,color:C.mt}}>🔢 {t.variableCount} variável(is)</span>
             {t.costPerConversation!=null&&<span style={{fontSize:12,color:C.dk,fontWeight:600}}>💰 R$ {Number(t.costPerConversation).toFixed(2)}/conversa</span>}
             {t.linkUrl&&<span style={{fontSize:12,color:C.mt}}>🔗 link</span>}
           </div>
           {t.status==='REJECTED'&&t.rejectedReason&&<p style={{fontSize:12,color:'#FF5252',marginTop:6}}>Motivo: {t.rejectedReason}</p>}
         </div>
         <div style={{display:'flex',gap:8,flexShrink:0}}>
           <button onClick={()=>{setEditing(t);setEditError('');}} title="Editar custo e link" style={{padding:'8px 10px',borderRadius:10,border:`1px solid ${C.br}`,background:'#fff'}}>
             <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke={C.dk} strokeWidth="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
           </button>
           <button onClick={()=>remove(t)} title="Excluir" style={{padding:'8px 10px',borderRadius:10,border:`1px solid ${C.br}`,background:'#fff'}}>
             <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FF5252" strokeWidth="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
           </button>
         </div>
       </div>)}
     </div>}
    {editing&&<TemplateEditModal template={editing} onClose={()=>setEditing(null)} onSave={saveEdit} saving={savingEdit} error={editError}/>}
  </div>;
}

/* ══════════════════════════ RELATÓRIO DE CAMPANHA ══════════════════════════ */
const pct=(n,base)=>base>0?Math.round((n/base)*100):0;
const brl=v=>v==null?'—':'R$ '+Number(v).toFixed(2);

function CampaignReport({campaign,onClose,onRefresh,refreshing,token,wabaId}){
  const [conv,setConv]=useState(null);

  // Fecha no Esc — modal sem isso prende o usuário no teclado
  useEffect(()=>{
    const h=e=>{if(e.key==='Escape')onClose();};
    window.addEventListener('keydown',h);
    return ()=>window.removeEventListener('keydown',h);
  },[onClose]);

  // Busca conversões quando a campanha está concluída ou já tem envios
  useEffect(()=>{
    if(!campaign?.id||!token||!wabaId||!campaign.sentCount) return;
    fetch(`${API}/api/crm/${wabaId}/campaigns/${campaign.id}/conversions?windowHours=720`,{headers:{Authorization:`Bearer ${token}`}})
      .then(r=>r.json()).then(d=>{if(d.success)setConv(d.data);}).catch(()=>{});
  },[campaign?.id,campaign?.sentCount]);

  if(!campaign) return null;
  const c=campaign;
  const total=c.totalRecipients||0;
  const sent=c.sentCount||0;
  // Leitura e clique só fazem sentido sobre o que realmente saiu
  const cards=[
    {label:'Enviadas', value:sent,             base:total, color:C.p,       icon:'📤'},
    {label:'Lidas',    value:c.readCount||0,   base:sent,  color:'#34B7F1', icon:'👁'},
    {label:'Cliques',  value:c.clickCount||0,  base:sent,  color:'#ECB22E', icon:'🖱'},
    {label:'Falhas',   value:c.failedCount||0, base:total, color:'#FF5252', icon:'⚠️'},
  ];
  const progress=pct(sent+(c.failedCount||0),total);

  return <div onClick={onClose} style={{position:'fixed',inset:0,background:'rgba(0,0,0,.45)',display:'flex',alignItems:'center',justifyContent:'center',zIndex:50,padding:20}}>
    <div onClick={e=>e.stopPropagation()} style={{background:'#fff',borderRadius:20,padding:26,width:'100%',maxWidth:620,maxHeight:'88vh',overflowY:'auto',boxShadow:'0 20px 60px rgba(0,0,0,.25)'}}>
      <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',gap:12,marginBottom:20}}>
        <div style={{minWidth:0}}>
          <h2 style={{fontSize:19,fontWeight:700,color:C.tx,marginBottom:4}}>{c.name}</h2>
          <p style={{fontSize:12,color:C.mt}}>
            {c.template?.name?'Template: '+c.template.name+' · ':''}
            {c.startedAt?'Disparada em '+new Date(c.startedAt).toLocaleString('pt-BR'):'Ainda não disparada'}
          </p>
        </div>
        <div style={{display:'flex',gap:8,flexShrink:0}}>
          <button onClick={onRefresh} disabled={refreshing} title="Atualizar" style={{padding:'7px 12px',borderRadius:10,border:`1px solid ${C.br}`,background:'#fff',fontSize:12,fontWeight:600,color:C.tx}}>
            {refreshing?'...':'↻'}
          </button>
          <button onClick={onClose} title="Fechar" style={{width:32,height:32,borderRadius:10,border:`1px solid ${C.br}`,background:'#fff',display:'flex',alignItems:'center',justifyContent:'center'}}>
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke={C.tx} strokeWidth="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
      </div>

      {/* Progresso */}
      <div style={{marginBottom:22}}>
        <div style={{display:'flex',justifyContent:'space-between',marginBottom:6}}>
          <span style={{fontSize:12,fontWeight:600,color:C.tx}}>Progresso do disparo</span>
          <span style={{fontSize:12,color:C.mt}}>{sent+(c.failedCount||0)} de {total} processados</span>
        </div>
        <div style={{height:10,borderRadius:99,background:C.bg,overflow:'hidden',display:'flex'}}>
          <div style={{width:pct(sent,total)+'%',background:C.p,transition:'width .4s'}}/>
          <div style={{width:pct(c.failedCount||0,total)+'%',background:'#FF5252',transition:'width .4s'}}/>
        </div>
        <p style={{fontSize:11,color:C.mt,marginTop:5}}>{progress}% concluído {c.status==='RUNNING'&&'· atualizando automaticamente'}</p>
      </div>

      {/* Métricas */}
      <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:10,marginBottom:22}}>
        {cards.map(m=><div key={m.label} style={{background:C.bg,borderRadius:14,padding:'14px 12px',textAlign:'center'}}>
          <div style={{fontSize:15,marginBottom:2}}>{m.icon}</div>
          <div style={{fontSize:22,fontWeight:800,color:m.color}}>{m.value}</div>
          <div style={{fontSize:11,color:C.mt,fontWeight:500}}>{m.label}</div>
          <div style={{fontSize:11,color:m.color,fontWeight:600,marginTop:2}}>{pct(m.value,m.base)}%</div>
        </div>)}
      </div>
      <p style={{fontSize:11,color:C.mt,marginTop:-14,marginBottom:20}}>
        Enviadas e falhas sobre o total de {total}; lidas e cliques sobre as {sent} efetivamente enviadas.
      </p>

      {/* Custo */}
      <div style={{background:C.bg,borderRadius:14,padding:16}}>
        <p style={{fontSize:13,fontWeight:600,color:C.tx,marginBottom:10}}>💰 Custo</p>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
          <div>
            <p style={{fontSize:11,color:C.mt}}>Estimado</p>
            <p style={{fontSize:18,fontWeight:700,color:C.tx}}>{brl(c.estimatedCost)}</p>
            <p style={{fontSize:11,color:C.mt}}>{total} destinatários</p>
          </div>
          <div>
            <p style={{fontSize:11,color:C.mt}}>Real</p>
            <p style={{fontSize:18,fontWeight:700,color:C.p}}>{brl(c.totalCost)}</p>
            <p style={{fontSize:11,color:C.mt}}>{sent} enviadas de fato</p>
          </div>
        </div>
        {c.estimatedCost!=null&&c.totalCost!=null&&c.totalCost<c.estimatedCost&&
          <p style={{fontSize:11,color:C.dk,marginTop:10}}>Economia de {brl(c.estimatedCost-c.totalCost)} — falhas não geram conversa cobrada.</p>}
        {c.estimatedCost==null&&
          <p style={{fontSize:11,color:C.mt,marginTop:10}}>Defina o custo por conversa no template para acompanhar gasto.</p>}
      </div>

      {/* Conversões */}
      {conv!=null&&(
        <div style={{background:'#F0FFF4',borderRadius:14,padding:16,marginTop:16,border:'1px solid #C6F6D5'}}>
          <p style={{fontSize:13,fontWeight:600,color:'#276749',marginBottom:12}}>🛒 Vendas Geradas</p>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:12}}>
            <div style={{textAlign:'center'}}>
              <div style={{fontSize:26,fontWeight:800,color:'#276749'}}>{conv.conversions}</div>
              <div style={{fontSize:11,color:'#68D391',fontWeight:500}}>pedidos realizados</div>
            </div>
            <div style={{textAlign:'center'}}>
              <div style={{fontSize:26,fontWeight:800,color:'#276749'}}>{conv.conversionRate}%</div>
              <div style={{fontSize:11,color:'#68D391',fontWeight:500}}>taxa de conversão</div>
            </div>
            <div style={{textAlign:'center'}}>
              <div style={{fontSize:22,fontWeight:800,color:'#276749'}}>{brl(conv.revenue)}</div>
              <div style={{fontSize:11,color:'#68D391',fontWeight:500}}>receita gerada</div>
            </div>
          </div>
        </div>
      )}
    </div>
  </div>;
}

/* ══════════════════════════ CAMPANHAS ══════════════════════════ */
function Campaigns({token,wabaId}){
  const [campaigns,setCampaigns]=useState([]);
  const [loading,setLoading]=useState(true);
  const [view,setView]=useState('list'); // list | create | detail
  const [selected,setSelected]=useState(null);
  const [form,setForm]=useState({name:'',templateId:'',templateParams:[],sourceFilter:[],segmentFilter:{allCustomers:false,daysInactive:'',minOrders:'',maxOrders:'',minTicket:'',maxTicket:'',preferredDay:'',topItem:''}});
  const [sourceDropOpen,setSourceDropOpen]=useState(false);
  const [templates,setTemplates]=useState([]);
  const [preview,setPreview]=useState(null);
  const [testPhone,setTestPhone]=useState('');
  const [sendingTest,setSendingTest]=useState(false);
  const [testResult,setTestResult]=useState(null);
  const [saving,setSaving]=useState(false);
  const [executing,setExecuting]=useState(false);
  const [report,setReport]=useState(null);
  const [reportId,setReportId]=useState(null);
  const [loadingReport,setLoadingReport]=useState(false);

  const load=async()=>{
    if(!token||!wabaId)return;
    setLoading(true);
    try{
      const r=await fetch(`${API}/api/crm/${wabaId}/campaigns`,{headers:{Authorization:`Bearer ${token}`}});
      const d=await r.json();
      if(d.success) setCampaigns(d.data);
    }catch(e){}
    setLoading(false);
  };

  const loadTemplates=async()=>{
    if(!token||!wabaId)return;
    try{
      const r=await fetch(`${API}/api/meta/${wabaId}/templates`,{headers:{Authorization:`Bearer ${token}`}});
      const d=await r.json();
      if(d.success) setTemplates(d.data.filter(t=>t.status==='APPROVED'));
    }catch(e){}
  };

  useEffect(()=>{load();loadTemplates();},[token,wabaId]);

  // ── Relatório ──
  const openReport=async(id)=>{
    setReportId(id);setLoadingReport(true);
    try{
      const r=await fetch(`${API}/api/crm/${wabaId}/campaigns/${id}`,{headers:{Authorization:`Bearer ${token}`}});
      const d=await r.json();
      if(d.success) setReport(d.data); else alert('Erro: '+d.message);
    }catch(e){alert('Erro: '+e.message);}
    setLoadingReport(false);
  };
  const closeReport=()=>{setReport(null);setReportId(null);};

  // Campanha em execução: atualiza sozinha para o usuário ver o disparo andar
  useEffect(()=>{
    if(!report||report.status!=='RUNNING')return;
    const t=setInterval(()=>{openReport(report.id);},5000);
    return ()=>clearInterval(t);
  },[report?.id,report?.status]);

  const selectedTpl=templates.find(t=>t.id===form.templateId)||null;

  const pickTemplate=(id)=>{
    const tpl=templates.find(t=>t.id===id);
    setForm(p=>({...p,templateId:id,templateParams:Array(tpl?.variableCount||0).fill('nome')}));
  };
  const setParam=(idx,token)=>setForm(p=>{
    const next=[...p.templateParams];next[idx]=token;return {...p,templateParams:next};
  });

  // Monta o segmento enviado ao backend. Único lugar que decide isso —
  // preview e salvamento precisam concordar, senão o alcance mostrado mente.
  const buildSegment=()=>{
    if(form.segmentFilter.allCustomers) return {allCustomers:true};
    const sf={};
    if(form.segmentFilter.daysInactive) sf.daysInactive=form.segmentFilter.daysInactive;
    if(form.segmentFilter.minOrders) sf.minOrders=form.segmentFilter.minOrders;
    if(form.segmentFilter.maxOrders) sf.maxOrders=form.segmentFilter.maxOrders;
    if(form.segmentFilter.minTicket) sf.minTicket=form.segmentFilter.minTicket;
    // 0 = domingo — o valor '' é "qualquer dia", por isso não dá para usar truthy
    if(form.segmentFilter.preferredDay!=='') sf.preferredDay=parseInt(form.segmentFilter.preferredDay);
    if(form.segmentFilter.topItem.trim()) sf.topItem=form.segmentFilter.topItem.trim();
    return sf;
  };

  // Origem só entra quando o campo está habilitado (com "todos" ele fica desabilitado na tela)
  const buildSourceFilter=()=>form.segmentFilter.allCustomers?null:(form.sourceFilter.length?form.sourceFilter:null);

  const doPreview=async()=>{
    try{
      const sf=buildSegment();
      const r=await fetch(`${API}/api/crm/${wabaId}/campaigns/preview`,{method:'POST',
        headers:{'Content-Type':'application/json',Authorization:`Bearer ${token}`},
        body:JSON.stringify({segmentFilter:sf,sourceFilter:buildSourceFilter()})});
      const d=await r.json();
      if(d.success) setPreview(d.data);
    }catch(e){}
  };

  const saveCampaign=async()=>{
    if(!form.name||!form.templateId){alert('Preencha o nome e selecione um template aprovado!');return;}
    setSaving(true);
    try{
      const sf=buildSegment();
      const r=await fetch(`${API}/api/crm/${wabaId}/campaigns`,{method:'POST',
        headers:{'Content-Type':'application/json',Authorization:`Bearer ${token}`},
        body:JSON.stringify({name:form.name,templateId:form.templateId,templateParams:form.templateParams,segmentFilter:sf,sourceFilter:buildSourceFilter()})});
      const d=await r.json();
      if(d.success){load();setView('list');setForm({name:'',templateId:'',templateParams:[],sourceFilter:[],segmentFilter:{allCustomers:false,daysInactive:'',minOrders:'',maxOrders:'',minTicket:'',maxTicket:'',preferredDay:'',topItem:''}});setPreview(null);}
      else alert('Erro: '+d.message);
    }catch(e){alert('Erro: '+e.message);}
    setSaving(false);
  };

  const sendTest=async()=>{
    if(!form.templateId){setTestResult({ok:false,msg:'Selecione um template antes de testar!'});return;}
    if(!testPhone.trim()){setTestResult({ok:false,msg:'Digite o numero para o teste!'});return;}
    setSendingTest(true);setTestResult(null);
    try{
      const r=await fetch(`${API}/api/crm/${wabaId}/campaigns/test-send`,{method:'POST',
        headers:{'Content-Type':'application/json',Authorization:`Bearer ${token}`},
        body:JSON.stringify({phone:testPhone.replace(/\D/g,''),templateId:form.templateId,templateParams:form.templateParams})});
      const d=await r.json();
      if(d.success) setTestResult({ok:true,msg:'\u2705 Mensagem de teste enviada para '+testPhone+'!'});
      else setTestResult({ok:false,msg:'\u274c Erro: '+d.message});
    }catch(e){setTestResult({ok:false,msg:'Erro: '+e.message});}
    setSendingTest(false);
  };

  const executeCampaign=async(id)=>{
    if(!confirm('Confirma o disparo da campanha? As mensagens serão enviadas agora.'))return;
    setExecuting(id);
    try{
      const r=await fetch(`${API}/api/crm/${wabaId}/campaigns/${id}/execute`,{method:'POST',headers:{Authorization:`Bearer ${token}`}});
      const d=await r.json();
      if(d.success){alert('✅ '+d.message);load();}
      else alert('❌ Erro: '+d.message);
    }catch(e){alert('Erro: '+e.message);}
    setExecuting(null);
  };

  const statusBadge=(s)=>{
    const map={DRAFT:['Rascunho','#667781','#f0f2f5'],RUNNING:['Disparando','#128C7E','#25D36618'],
      COMPLETED:['Concluída','#25D366','#25D36618'],FAILED:['Falhou','#FF5252','#FF525218'],PAUSED:['Pausada','#ECB22E','#ECB22E18']};
    const [label,col,bg]=map[s]||['–','#667781','#f0f2f5'];
    return <span style={{fontSize:11,fontWeight:600,padding:'3px 10px',borderRadius:20,background:bg,color:col}}>{label}</span>;
  };

  // Tokens do CRM que podem alimentar cada variável posicional do template
  const TOKENS=[
    {v:'nome',             label:'Nome do cliente',  sample:'João'},
    {v:'produto_favorito', label:'Produto favorito', sample:'Pizza de Frango'},
    {v:'dias_sem_comprar', label:'Dias sem comprar', sample:'8'},
    {v:'total_pedidos',    label:'Total de pedidos', sample:'12'},
    {v:'ticket_medio',     label:'Ticket médio',     sample:'R$ 45.00'},
    {v:'link_rastreado',   label:'Link rastreado',   sample:'https://.../r/abc123'},
  ];
  const inp2={width:'100%',padding:'9px 12px',borderRadius:10,border:`1px solid ${C.br}`,fontSize:13,color:C.tx,background:'#fff',outline:'none'};
  const todos=!!form.segmentFilter.allCustomers;

  // Renderiza o corpo do template ({{1}}, {{2}}…) com valores de exemplo
  const renderPreview=()=>{
    if(!selectedTpl) return '';
    return String(selectedTpl.bodyText||'').replace(/\{\{\s*(\d+)\s*\}\}/g,(m,n)=>{
      const tok=form.templateParams[Number(n)-1];
      return TOKENS.find(t=>t.v===tok)?.sample ?? m;
    });
  };

  if(view==='create') return <div style={{padding:24,overflowY:'auto',height:'100%'}}>
    <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:20}}>
      <button onClick={()=>{setView('list');setPreview(null);}} style={{width:34,height:34,borderRadius:10,border:`1px solid ${C.br}`,background:'#fff',display:'flex',alignItems:'center',justifyContent:'center'}}>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke={C.tx} strokeWidth="2"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <div><h1 style={{fontSize:20,fontWeight:700,color:C.tx}}>Nova Campanha</h1><p style={{fontSize:13,color:C.mt}}>Configure e dispare mensagens para sua base</p></div>
    </div>
    <div style={{display:'grid',gridTemplateColumns:'1fr 380px',gap:16}}>
      {/* Formulário */}
      <div style={{display:'flex',flexDirection:'column',gap:14}}>
        <div style={{background:'#fff',borderRadius:16,padding:20,border:`1px solid ${C.br}`}}>
          <h3 style={{fontWeight:600,color:C.tx,marginBottom:14,fontSize:15}}>📋 Informações</h3>
          <label style={{fontSize:13,fontWeight:500,color:C.tx,display:'block',marginBottom:5}}>Nome da campanha</label>
          <input value={form.name} onChange={e=>setForm(p=>({...p,name:e.target.value}))} placeholder="Ex: Clientes inativos - Abril" style={{...inp2,marginBottom:14}}/>
          <label style={{fontSize:13,fontWeight:500,color:C.tx,display:'block',marginBottom:5}}>Template aprovado</label>
          {templates.length===0
            ? <div style={{padding:'12px 14px',borderRadius:10,background:'#FFF8E1',border:'1px solid #ECB22E40',fontSize:12,color:'#7A5B00',lineHeight:1.5}}>
                Nenhum template aprovado ainda. Vá em <b>Templates</b>, crie um e aguarde a aprovação da Meta — o disparo em massa só funciona com template.
              </div>
            : <>
              <select value={form.templateId} onChange={e=>pickTemplate(e.target.value)} style={inp2}>
                <option value="">Selecione um template…</option>
                {templates.map(t=><option key={t.id} value={t.id}>{t.name} ({t.variableCount} var.)</option>)}
              </select>
              {selectedTpl&&<div style={{marginTop:12,padding:'12px 14px',borderRadius:10,background:C.bg}}>
                <p style={{fontSize:12,color:C.tx,lineHeight:1.5,whiteSpace:'pre-wrap'}}>{selectedTpl.bodyText}</p>
              </div>}
              {selectedTpl&&selectedTpl.variableCount>0&&<div style={{marginTop:14}}>
                <label style={{fontSize:13,fontWeight:500,color:C.tx,display:'block',marginBottom:6}}>Mapeamento das variáveis</label>
                {Array.from({length:selectedTpl.variableCount},(_,i)=><div key={i} style={{display:'flex',alignItems:'center',gap:10,marginBottom:8}}>
                  <span style={{fontSize:12,fontWeight:700,color:C.dk,minWidth:38}}>{'{{'+(i+1)+'}}'}</span>
                  <select value={form.templateParams[i]||''} onChange={e=>setParam(i,e.target.value)} style={{...inp2,flex:1}}>
                    {TOKENS.map(t=><option key={t.v} value={t.v}>{t.label}</option>)}
                  </select>
                </div>)}
                <p style={{fontSize:11,color:C.mt,marginTop:2}}>Cada posição do template recebe um dado do cliente no momento do envio.</p>
              </div>}
            </>}
        </div>
        <div style={{background:'#fff',borderRadius:16,padding:20,border:`1px solid ${C.br}`}}>
          <h3 style={{fontWeight:600,color:C.tx,marginBottom:14,fontSize:15}}>🎯 Segmentação</h3>
          <label style={{display:'flex',alignItems:'center',gap:9,padding:'11px 13px',borderRadius:12,marginBottom:14,cursor:'pointer',
            background:todos?C.p+'15':C.bg,border:`1px solid ${todos?C.p:C.br}`}}>
            <input type="checkbox" checked={todos}
              onChange={e=>{setPreview(null);setForm(p=>({...p,segmentFilter:{...p.segmentFilter,allCustomers:e.target.checked}}));}}
              style={{width:16,height:16,accentColor:C.p,cursor:'pointer'}}/>
            <div>
              <p style={{fontSize:13,fontWeight:600,color:todos?C.dkk:C.tx}}>Todos os clientes</p>
              <p style={{fontSize:11,color:C.mt}}>Ignora os filtros abaixo e envia para a base inteira.</p>
            </div>
          </label>
          <div style={{marginBottom:14,opacity:todos?.45:1,position:'relative'}}>
            <label style={{fontSize:12,color:C.mt,display:'block',marginBottom:4}}>Origem dos contatos</label>
            {(()=>{
              const srcOpts=[
                {v:'multipedidos',l:'Multipedidos'},
                {v:'fidelidade_10x',l:'Fidelidade 10x'},{v:'fidelidade_20x',l:'Fidelidade 20x'},
                {v:'fidelidade_30x',l:'Fidelidade 30x'},{v:'fidelidade_40x',l:'Fidelidade 40x'},
                {v:'fidelidade_50x',l:'Fidelidade 50x'},{v:'fidelidade_60x',l:'Fidelidade 60x'},
                {v:'fidelidade_70x',l:'Fidelidade 70x'},{v:'fidelidade_80x',l:'Fidelidade 80x'},
                {v:'fidelidade_90x',l:'Fidelidade 90x'},{v:'fidelidade_100x',l:'Fidelidade 100x+'},
              ];
              const sel=form.sourceFilter||[];
              const toggleSrc=(v)=>{
                setPreview(null);
                setForm(p=>({...p,sourceFilter:p.sourceFilter.includes(v)?p.sourceFilter.filter(x=>x!==v):[...p.sourceFilter,v]}));
              };
              const label=sel.length===0?'Todas as origens':sel.length===1?srcOpts.find(o=>o.v===sel[0])?.l||sel[0]:`${sel.length} origens selecionadas`;
              return(
                <div style={{position:'relative'}}>
                  <div onClick={()=>{if(!todos)setSourceDropOpen(p=>!p);}} style={{...inp2,display:'flex',justifyContent:'space-between',alignItems:'center',cursor:todos?'not-allowed':'pointer',color:sel.length?C.p:C.mt,fontWeight:sel.length?600:400,userSelect:'none'}}>
                    <span>{label}</span>
                    <span style={{fontSize:10,color:C.mt}}>{sourceDropOpen?'▲':'▼'}</span>
                  </div>
                  {sourceDropOpen&&!todos&&(
                    <div style={{position:'absolute',top:'100%',left:0,right:0,background:'#fff',border:`1px solid ${C.br}`,borderRadius:12,boxShadow:'0 4px 16px rgba(0,0,0,0.10)',zIndex:99,maxHeight:220,overflowY:'auto',marginTop:4}}>
                      {srcOpts.map(o=>(
                        <label key={o.v} style={{display:'flex',alignItems:'center',gap:10,padding:'9px 14px',cursor:'pointer',background:sel.includes(o.v)?C.p+'12':'transparent',transition:'background .15s'}}
                          onMouseEnter={e=>e.currentTarget.style.background=sel.includes(o.v)?C.p+'20':C.bg}
                          onMouseLeave={e=>e.currentTarget.style.background=sel.includes(o.v)?C.p+'12':'transparent'}>
                          <input type="checkbox" checked={sel.includes(o.v)} onChange={()=>toggleSrc(o.v)}
                            style={{width:15,height:15,accentColor:C.p,cursor:'pointer'}}/>
                          <span style={{fontSize:13,color:sel.includes(o.v)?C.p:C.tx,fontWeight:sel.includes(o.v)?600:400}}>{o.l}</span>
                        </label>
                      ))}
                      <div style={{padding:'8px 14px',borderTop:`1px solid ${C.br}`}}>
                        <button onClick={()=>{setPreview(null);setForm(p=>({...p,sourceFilter:[]}));setSourceDropOpen(false);}}
                          style={{fontSize:11,color:C.mt,background:'none',border:'none',cursor:'pointer',padding:0}}>Limpar seleção</button>
                      </div>
                    </div>
                  )}
                </div>
              );
            })()}
          </div>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12,opacity:todos?.45:1,pointerEvents:todos?'none':'auto'}}>
            <div>
              <label style={{fontSize:12,color:C.mt,display:'block',marginBottom:4}}>Dias sem comprar (mín.)</label>
              <input type="number" disabled={todos} value={form.segmentFilter.daysInactive} onChange={e=>setForm(p=>({...p,segmentFilter:{...p.segmentFilter,daysInactive:e.target.value}}))} placeholder="Ex: 7" style={inp2}/>
            </div>
            <div>
              <label style={{fontSize:12,color:C.mt,display:'block',marginBottom:4}}>Pedidos mínimos</label>
              <input type="number" disabled={todos} value={form.segmentFilter.minOrders} onChange={e=>setForm(p=>({...p,segmentFilter:{...p.segmentFilter,minOrders:e.target.value}}))} placeholder="Ex: 2" style={inp2}/>
            </div>
            <div>
              <label style={{fontSize:12,color:C.mt,display:'block',marginBottom:4}}>Pedidos máximos</label>
              <input type="number" disabled={todos} value={form.segmentFilter.maxOrders} onChange={e=>setForm(p=>({...p,segmentFilter:{...p.segmentFilter,maxOrders:e.target.value}}))} placeholder="Ex: 10" style={inp2}/>
            </div>
            <div>
              <label style={{fontSize:12,color:C.mt,display:'block',marginBottom:4}}>Ticket médio mín. (R$)</label>
              <input type="number" disabled={todos} value={form.segmentFilter.minTicket} onChange={e=>setForm(p=>({...p,segmentFilter:{...p.segmentFilter,minTicket:e.target.value}}))} placeholder="Ex: 50" style={inp2}/>
            </div>
            <div>
              <label style={{fontSize:12,color:C.mt,display:'block',marginBottom:4}}>Dia preferido de compra</label>
              <select disabled={todos} value={form.segmentFilter.preferredDay} onChange={e=>{setPreview(null);setForm(p=>({...p,segmentFilter:{...p.segmentFilter,preferredDay:e.target.value}}));}} style={inp2}>
                <option value="">Qualquer dia</option>
                <option value="0">Domingo</option>
                <option value="1">Segunda</option>
                <option value="2">Terça</option>
                <option value="3">Quarta</option>
                <option value="4">Quinta</option>
                <option value="5">Sexta</option>
                <option value="6">Sábado</option>
              </select>
            </div>
            <div>
              <label style={{fontSize:12,color:C.mt,display:'block',marginBottom:4}}>Sabor/item mais pedido</label>
              <input type="text" disabled={todos} value={form.segmentFilter.topItem} onChange={e=>setForm(p=>({...p,segmentFilter:{...p.segmentFilter,topItem:e.target.value}}))} placeholder="Ex: Pizza, Hamburguer..." style={inp2}/>
            </div>
          </div>
          <button onClick={()=>doPreview()} style={{marginTop:14,padding:'9px 20px',borderRadius:10,border:`1px solid ${C.p}`,background:C.p+'15',color:C.dk,fontWeight:600,fontSize:13}}>
            👁 Calcular alcance
          </button>
        </div>
      </div>
      {/* Preview */}
      <div style={{display:'flex',flexDirection:'column',gap:14}}>
        {preview&&<div style={{background:'#fff',borderRadius:16,padding:20,border:`2px solid ${C.p}`}}>
          <h3 style={{fontWeight:600,color:C.tx,marginBottom:12,fontSize:15}}>📊 Alcance</h3>
          <div style={{fontSize:36,fontWeight:800,color:C.p,marginBottom:4}}>{preview.count}</div>
          <p style={{fontSize:13,color:C.mt,marginBottom:14}}>clientes serão impactados</p>
          {selectedTpl&&(selectedTpl.costPerConversation!=null
            ? <div style={{padding:'10px 12px',borderRadius:10,background:C.p+'12',marginBottom:14}}>
                <p style={{fontSize:12,color:C.dkk,fontWeight:600}}>Estimativa de custo</p>
                <p style={{fontSize:12,color:C.tx,marginTop:2}}>
                  {preview.count} pessoas × R$ {Number(selectedTpl.costPerConversation).toFixed(2)} = <b style={{fontSize:14}}>R$ {(preview.count*Number(selectedTpl.costPerConversation)).toFixed(2)}</b>
                </p>
              </div>
            : <div style={{padding:'10px 12px',borderRadius:10,background:'#FFF8E1',marginBottom:14,fontSize:12,color:'#7A5B00'}}>
                O template não tem custo por conversa definido — sem estimativa de gasto.
              </div>)}
          {preview.sample?.length>0&&<><p style={{fontSize:12,fontWeight:600,color:C.mt,marginBottom:8}}>Exemplos:</p>
          {preview.sample.map(c=><div key={c.id} style={{display:'flex',alignItems:'center',gap:8,marginBottom:8}}>
            <Av name={c.name||c.phone} sz={28}/><div>
              <p style={{fontSize:12,fontWeight:500,color:C.tx}}>{c.name||'Sem nome'}</p>
              <p style={{fontSize:11,color:C.mt}}>{c.daysSinceOrder} dias sem comprar</p>
            </div>
          </div>)}</>}
        </div>}
        {selectedTpl&&<div style={{background:'#fff',borderRadius:16,padding:20,border:`1px solid ${C.br}`}}>
          <h3 style={{fontWeight:600,color:C.tx,marginBottom:12,fontSize:15}}>💬 Preview da mensagem</h3>
          <div style={{background:C.bg,borderRadius:12,padding:12}}>
            <div style={{background:C.bbl,borderRadius:'12px 12px 4px 12px',padding:'8px 12px',maxWidth:'85%',marginLeft:'auto'}}>
              <p style={{fontSize:13,color:C.tx,lineHeight:1.5,whiteSpace:'pre-wrap'}}>{renderPreview()}</p>
              <p style={{fontSize:10,color:C.mt,textAlign:'right',marginTop:4}}>Pré-visualização</p>
            </div>
          </div>
        </div>}
        {selectedTpl&&<div style={{background:'#fff',borderRadius:16,padding:20,border:`1px solid ${C.br}`}}>
          <h3 style={{fontWeight:600,color:C.tx,marginBottom:8,fontSize:15}}>📱 Enviar teste</h3>
          <p style={{fontSize:12,color:C.mt,marginBottom:10}}>Teste a mensagem no seu WhatsApp antes de disparar para todos.</p>
          <input value={testPhone} onChange={e=>setTestPhone(e.target.value)} placeholder="Ex: 47997109331" type="tel"
            style={{...inp2,marginBottom:10}}/>
          <button onClick={sendTest} disabled={sendingTest||!testPhone.trim()} style={{width:'100%',padding:'10px',borderRadius:10,border:'none',background:'#075E54',color:'#fff',fontWeight:600,fontSize:13,opacity:(sendingTest||!testPhone.trim())?0.6:1}}>
            {sendingTest?'Enviando...':'📱 Enviar teste'}
          </button>
          {testResult&&<div style={{marginTop:8,padding:'8px 12px',borderRadius:8,background:testResult.ok?'#25D36618':'#FF525218',color:testResult.ok?'#075E54':'#FF5252',fontSize:12,fontWeight:500}}>
            {testResult.msg}
          </div>}
        </div>}
        <button onClick={saveCampaign} disabled={saving} style={{padding:'14px',borderRadius:14,border:'none',background:C.p,color:'#fff',fontWeight:700,fontSize:14,boxShadow:'0 4px 14px rgba(37,211,102,.3)'}}>
          {saving?'Salvando...':'💾 Salvar campanha'}
        </button>
      </div>
    </div>
  </div>;

  return <div style={{padding:24,overflowY:'auto',height:'100%'}}>
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:20}}>
      <div><h1 style={{fontSize:22,fontWeight:700,color:C.tx}}>Campanhas</h1><p style={{fontSize:13,color:C.mt,marginTop:2}}>Crie e dispare mensagens para sua base</p></div>
      <button onClick={()=>setView('create')} style={{display:'flex',alignItems:'center',gap:6,padding:'9px 18px',borderRadius:12,border:'none',background:C.p,color:'#fff',fontWeight:600,fontSize:13}}>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> Nova campanha
      </button>
    </div>
    {loading?<div style={{textAlign:'center',padding:60,color:C.mt}}>Carregando...</div>:
     campaigns.length===0?<div style={{background:'#fff',borderRadius:18,padding:60,textAlign:'center',border:`1px solid ${C.br}`}}>
       <div style={{width:60,height:60,borderRadius:18,background:C.p+'15',display:'flex',alignItems:'center',justifyContent:'center',margin:'0 auto 14px'}}>
         <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke={C.p} strokeWidth="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
       </div>
       <h3 style={{fontWeight:700,color:C.tx,marginBottom:6}}>Nenhuma campanha ainda</h3>
       <p style={{fontSize:13,color:C.mt,marginBottom:20}}>Crie sua primeira campanha e comece a recuperar clientes!</p>
       <button onClick={()=>setView('create')} style={{padding:'10px 24px',borderRadius:12,border:'none',background:C.p,color:'#fff',fontWeight:600,fontSize:13}}>Criar campanha</button>
     </div>:
     <div style={{display:'flex',flexDirection:'column',gap:12}}>
       {campaigns.map(c=><div key={c.id} onClick={()=>openReport(c.id)} title="Ver relatório"
         style={{background:'#fff',borderRadius:16,padding:20,border:`1px solid ${C.br}`,display:'flex',alignItems:'center',gap:16,cursor:'pointer'}}>
         <div style={{width:44,height:44,borderRadius:12,background:C.p+'15',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
           <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke={C.p} strokeWidth="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
         </div>
         <div style={{flex:1}}>
           <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:4}}>
             <p style={{fontWeight:600,fontSize:14,color:C.tx}}>{c.name}</p>
             {statusBadge(c.status)}
           </div>
           <p style={{fontSize:12,color:C.mt,overflow:'hidden',whiteSpace:'nowrap',textOverflow:'ellipsis',maxWidth:400}}>{c.message}</p>
           <div style={{display:'flex',gap:16,marginTop:6}}>
             <span style={{fontSize:12,color:C.mt}}>👥 {c.totalRecipients} destinatários</span>
             {c.sentCount>0&&<span style={{fontSize:12,color:C.p}}>✅ {c.sentCount} enviados</span>}
             {c.readCount>0&&<span style={{fontSize:12,color:'#34B7F1'}}>👁 {c.readCount} lidas</span>}
             {c.clickCount>0&&<span style={{fontSize:12,color:'#ECB22E'}}>🖱 {c.clickCount} cliques</span>}
             {c.failedCount>0&&<span style={{fontSize:12,color:'#FF5252'}}>❌ {c.failedCount} falhas</span>}
             {c.totalCost!=null&&<span style={{fontSize:12,color:C.dk,fontWeight:600}}>{brl(c.totalCost)}</span>}
             <span style={{fontSize:12,color:C.mt}}>{new Date(c.createdAt).toLocaleDateString('pt-BR')}</span>
           </div>
         </div>
         {(c.status==='DRAFT')&&<button onClick={e=>{e.stopPropagation();executeCampaign(c.id);}} disabled={executing===c.id}
           style={{padding:'9px 18px',borderRadius:10,border:'none',background:C.p,color:'#fff',fontWeight:600,fontSize:13,flexShrink:0}}>
           {executing===c.id?'Disparando...':'🚀 Disparar'}
         </button>}
         {c.status==='COMPLETED'&&<div style={{textAlign:'center',flexShrink:0}}>
           <div style={{fontSize:20,fontWeight:800,color:C.p}}>{c.totalRecipients>0?Math.round((c.sentCount/c.totalRecipients)*100):0}%</div>
           <div style={{fontSize:11,color:C.mt}}>enviados</div>
         </div>}
       </div>)}
     </div>}
    {reportId&&!report&&loadingReport&&<div style={{position:'fixed',inset:0,background:'rgba(0,0,0,.45)',display:'flex',alignItems:'center',justifyContent:'center',zIndex:50,color:'#fff',fontSize:13}}>Carregando relatório...</div>}
    {report&&<CampaignReport campaign={report} onClose={closeReport} onRefresh={()=>openReport(report.id)} refreshing={loadingReport} token={token} wabaId={wabaId}/>}
  </div>;
}

  {id:'dashboard',    label:'Dashboard',           icon:"M18 20V10M12 20V4M6 20v-6"},
  {id:'conversations',label:'Conversas',            icon:"M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"},
  {id:'crm',          label:'CRM',                 icon:"M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z"},
  {id:'campaigns',    label:'Campanhas',            icon:"M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"},
  {id:'relatorio',    label:'Relatório',            icon:"M18 20V10M12 20V4M6 20v-6"},
  {id:'templates',    label:'Templates',            icon:"M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"},
  {id:'contacts',     label:'Contatos',             icon:"M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z"},
  {id:'connect',      label:'Conectar WhatsApp',    icon:"M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"},
  {id:'integracoes',  label:'Integrações',          icon:"M4 6h16M4 10h16M4 14h16M4 18h16"},
  {id:'settings',     label:'Configurações',        icon:"M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"},
];
/* ══════════════════════════ RELATÓRIO DE CAMPANHAS ══════════════════════════ */
function CampaignRelatorio({token,wabaId}){
  const today=new Date();
  const firstDay=new Date(today.getFullYear(),today.getMonth(),1).toISOString().slice(0,10);
  const todayStr=today.toISOString().slice(0,10);
  const [startDate,setStartDate]=useState(firstDay);
  const [endDate,setEndDate]=useState(todayStr);
  const [data,setData]=useState(null);
  const [loading,setLoading]=useState(false);

  const load=async()=>{
    if(!token||!wabaId)return;
    setLoading(true);
    try{
      const r=await fetch(`${API}/api/crm/${wabaId}/campaigns-report?startDate=${startDate}&endDate=${endDate}`,
        {headers:{Authorization:`Bearer ${token}`}});
      const d=await r.json();
      if(d.success) setData(d.data);
    }catch(e){}
    setLoading(false);
  };

  useEffect(()=>{load();},[token,wabaId]);

  const cards=[
    {label:'Disparos',      value:data?.totalDisparos??'—',  fmt:v=>v,                          icon:'📤', color:C.p},
    {label:'Valor Gasto',   value:data?.totalGasto??null,    fmt:v=>brl(v),                     icon:'💸', color:'#FF7043'},
    {label:'Vendas Geradas',value:data?.vendasGeradas??'—',  fmt:v=>v,                          icon:'🛒', color:'#276749'},
    {label:'Receita Gerada',value:data?.receitaGerada??null, fmt:v=>brl(v),                     icon:'💰', color:'#276749'},
  ];

  return <div style={{padding:28,maxWidth:860,margin:'0 auto'}}>
    <h1 style={{fontSize:22,fontWeight:700,color:C.tx,marginBottom:4}}>Relatório</h1>
    <p style={{fontSize:13,color:C.mt,marginBottom:24}}>Visão geral dos resultados das campanhas no período selecionado.</p>

    {/* Filtro de data */}
    <div style={{display:'flex',alignItems:'flex-end',gap:12,marginBottom:28,background:'#fff',padding:18,borderRadius:16,border:`1px solid ${C.br}`}}>
      <div>
        <label style={{fontSize:12,color:C.mt,display:'block',marginBottom:4}}>Data inicial</label>
        <input type="date" value={startDate} onChange={e=>setStartDate(e.target.value)}
          style={{padding:'9px 12px',borderRadius:10,border:`1px solid ${C.br}`,fontSize:13,color:C.tx,outline:'none'}}/>
      </div>
      <div>
        <label style={{fontSize:12,color:C.mt,display:'block',marginBottom:4}}>Data final</label>
        <input type="date" value={endDate} onChange={e=>setEndDate(e.target.value)}
          style={{padding:'9px 12px',borderRadius:10,border:`1px solid ${C.br}`,fontSize:13,color:C.tx,outline:'none'}}/>
      </div>
      <button onClick={load} disabled={loading}
        style={{padding:'9px 22px',borderRadius:10,border:'none',background:C.p,color:'#fff',fontWeight:600,fontSize:13,cursor:'pointer',opacity:loading?.7:1}}>
        {loading?'Buscando...':'Buscar'}
      </button>
    </div>

    {/* Cards */}
    <div style={{display:'grid',gridTemplateColumns:'repeat(2,1fr)',gap:16}}>
      {cards.map(c=>(
        <div key={c.label} style={{background:'#fff',borderRadius:16,padding:24,border:`1px solid ${C.br}`,display:'flex',alignItems:'center',gap:18}}>
          <div style={{width:52,height:52,borderRadius:14,background:c.color+'15',display:'flex',alignItems:'center',justifyContent:'center',fontSize:24,flexShrink:0}}>
            {c.icon}
          </div>
          <div>
            <p style={{fontSize:12,color:C.mt,marginBottom:4}}>{c.label}</p>
            <p style={{fontSize:28,fontWeight:800,color:c.color,lineHeight:1}}>
              {data==null&&loading?'...':(typeof c.value==='number'?c.fmt(c.value):c.value)}
            </p>
          </div>
        </div>
      ))}
    </div>

    {data&&<p style={{fontSize:11,color:C.mt,marginTop:16,textAlign:'center'}}>
      Vendas e receita: pedidos realizados em até 30 dias após o recebimento do disparo.
    </p>}
  </div>;
}

function Layout({user,token,onLogout}){
  const [page,setPage]=useState('dashboard');
  const [wabaId,setWabaId]=useState(null);
  const isCv=page==='conversations';
  useEffect(()=>{
    if(!token)return;
    fetch(`${API}/api/auth/me`,{headers:{Authorization:`Bearer ${token}`}})
      .then(r=>r.json()).then(d=>{const acc=d?.data?.wabaAccounts?.[0];if(acc)setWabaId(acc.id);}).catch(()=>{});
  },[token]);
  return <div style={{display:'flex',height:'100vh',overflow:'hidden',background:C.bg}}>
    <aside style={{width:238,flexShrink:0,display:'flex',flexDirection:'column',background:'#fff',borderRight:`1px solid ${C.br}`}}>
      <div style={{display:'flex',alignItems:'center',gap:10,padding:'18px 20px',borderBottom:`1px solid ${C.br}`}}>
        <div style={{width:36,height:36,borderRadius:10,background:C.p,display:'flex',alignItems:'center',justifyContent:'center'}}>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        </div>
        <span style={{fontWeight:800,fontSize:18,color:C.tx}}>ZapCloud</span>
      </div>
      <nav style={{flex:1,padding:10}}>
        {NAV.map(n=><button key={n.id} onClick={()=>setPage(n.id)}
          style={{width:'100%',display:'flex',alignItems:'center',gap:11,padding:'10px 12px',borderRadius:12,border:'none',marginBottom:2,fontWeight:500,fontSize:13,background:page===n.id?C.p+'18':'transparent',color:page===n.id?C.dkk:C.mt,textAlign:'left'}}>
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke={page===n.id?C.dkk:C.mt} strokeWidth="2"><path d={n.icon}/></svg>
          {n.label}
        </button>)}
      </nav>
      <div style={{padding:'13px 16px',borderTop:`1px solid ${C.br}`,display:'flex',alignItems:'center',gap:10}}>
        <Av name={user.name} sz={34}/>
        <div style={{flex:1,minWidth:0}}>
          <p style={{fontSize:13,fontWeight:600,color:C.tx,overflow:'hidden',whiteSpace:'nowrap',textOverflow:'ellipsis'}}>{user.name}</p>
          <p style={{fontSize:11,color:C.mt,overflow:'hidden',whiteSpace:'nowrap',textOverflow:'ellipsis'}}>{user.email}</p>
        </div>
        <button onClick={onLogout} title="Sair" style={{border:'none',background:'none',padding:4,borderRadius:8,display:'flex',alignItems:'center',justifyContent:'center'}}>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke={C.mt} strokeWidth="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
        </button>
      </div>
    </aside>
    <div style={{flex:1,display:'flex',flexDirection:'column',overflow:'hidden'}}>
      <header style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'12px 20px',background:'#fff',borderBottom:`1px solid ${C.br}`,boxShadow:'0 1px 4px rgba(0,0,0,.05)',flexShrink:0}}>
        <span style={{fontWeight:600,color:C.tx,fontSize:15}}>{NAV.find(n=>n.id===page)?.label}</span>
        <div style={{display:'flex',alignItems:'center',gap:8}}>
          <button style={{position:'relative',width:36,height:36,borderRadius:'50%',border:'none',background:'none',display:'flex',alignItems:'center',justifyContent:'center'}}>
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke={C.mt} strokeWidth="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 0 1-3.46 0"/></svg>
            <span style={{position:'absolute',top:7,right:7,width:8,height:8,borderRadius:'50%',background:C.p}}/>
          </button>
          <Av name={user.name} sz={32}/>
        </div>
      </header>
      <main style={{flex:1,minHeight:0,overflow:isCv?'hidden':'auto'}}>
        {page==='dashboard'     &&<Dashboard onNavigate={setPage} token={token}/>}
        {page==='conversations' &&<Conversations token={token}/>}
        {page==='crm'           &&<CRM token={token} wabaId={wabaId}/>}
        {page==='campaigns'     &&<Campaigns token={token} wabaId={wabaId}/>}
        {page==='relatorio'     &&<CampaignRelatorio token={token} wabaId={wabaId}/>}
        {page==='templates'     &&<Templates token={token} wabaId={wabaId}/>}
        {page==='contacts'      &&<Contacts token={token} wabaId={wabaId}/>}
        {page==='connect'       &&<Connect token={token}/>}
        {page==='integracoes'   &&<Integracoes token={token}/>}
        {page==='settings'      &&<Settings user={user}/>}
      </main>
    </div>
  </div>;
}

/* ══════════════════════════ APP ══════════════════════════ */
const TOKEN_KEY='zapcloud_token';
// localStorage pode lançar (modo privado, cookies bloqueados) — nunca deixar quebrar o app
const lsGet=k=>{try{return localStorage.getItem(k);}catch(e){return null;}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v);}catch(e){}};
const lsDel=k=>{try{localStorage.removeItem(k);}catch(e){}};

function Splash(){
  return <div style={{display:'flex',alignItems:'center',justifyContent:'center',height:'100vh',flexDirection:'column',gap:12,color:C.mt}}>
    <div className="spin" style={{width:32,height:32,border:`3px solid ${C.p}`,borderTopColor:'transparent',borderRadius:'50%'}}/>
    <span style={{fontSize:13}}>Restaurando sessão...</span>
  </div>;
}

function App(){
  const [user,setUser]=useState(null);
  const [token,setToken]=useState(null);
  const [booting,setBooting]=useState(true);

  // Ao montar: restaura a sessão a partir do token salvo, validando em /api/auth/me
  useEffect(()=>{
    let cancelled=false;
    const saved=lsGet(TOKEN_KEY);
    if(!saved){setBooting(false);return;}
    fetch(`${API}/api/auth/me`,{headers:{Authorization:`Bearer ${saved}`}})
      .then(async r=>{
        if(r.status===401){lsDel(TOKEN_KEY);return;} // token expirado ou inválido
        const d=await r.json();
        if(!cancelled&&d&&d.success){setUser(d.data);setToken(saved);}
      })
      .catch(()=>{}) // rede indisponível: preserva o token e tenta no próximo load
      .finally(()=>{if(!cancelled)setBooting(false);});
    return ()=>{cancelled=true;};
  },[]);

  const login=(u,t)=>{lsSet(TOKEN_KEY,t);setUser(u);setToken(t);};
  const logout=()=>{lsDel(TOKEN_KEY);setUser(null);setToken(null);};

  if(booting) return <Splash/>;
  if(!user) return <Login onLogin={login}/>;
  return <Layout user={user} token={token} onLogout={logout}/>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
<script>
(function(){
  var root=document.getElementById('root');
  var started=Date.now();
  // Mostrar loading imediatamente
  root.innerHTML='<div id="zc-loading" style="display:flex;align-items:center;justify-content:center;height:100vh;font-family:sans-serif;flex-direction:column;gap:12px;color:#667781"><div style="width:32px;height:32px;border:3px solid #25D366;border-top-color:transparent;border-radius:50%;animation:spin 0.8s linear infinite"></div><span id="zc-status">Carregando...</span></div>';
  function setStatus(msg){var el=document.getElementById('zc-status');if(el)el.textContent=msg;}
  function runApp(){
    var el=document.getElementById('jsx-src');
    if(!el){root.innerHTML='<div style="padding:40px;color:#e53e3e;font-family:sans-serif"><b>Erro:</b> elemento jsx-src nao encontrado</div>';return;}
    if(!window.Babel){
      if(Date.now()-started>10000){root.innerHTML='<div style="padding:40px;color:#e53e3e;font-family:sans-serif"><b>Erro:</b> Babel CDN nao carregou (verifique conexao com internet)</div>';return;}
      setStatus('Carregando Babel...');
      return setTimeout(runApp,100);
    }
    if(!window.React){root.innerHTML='<div style="padding:40px;color:#e53e3e;font-family:sans-serif"><b>Erro:</b> React CDN nao carregou</div>';return;}
    if(root.children.length>0&&!document.getElementById('zc-loading'))return;
    setStatus('Compilando app...');
    setTimeout(function(){
      try{
        var code=Babel.transform(el.textContent,{presets:['react'],filename:'app.jsx'}).code;
        root.innerHTML='';
        (0,eval)(code);
      }catch(e){
        root.innerHTML='<div style="padding:40px;color:#e53e3e;font-family:sans-serif"><b>Erro ao compilar:</b><br>'+e.message+'</div>';
        console.error('App error:',e);
      }
    },0);
  }
  if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',runApp);}
  else{runApp();}
})();
</script>
</body>
